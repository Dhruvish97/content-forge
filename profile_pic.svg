<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D1A"/>
      <stop offset="100%" style="stop-color:#1A1A3E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5D4"/>
      <stop offset="100%" style="stop-color:#7B2FBE"/>
    </linearGradient>
    <linearGradient id="horn" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
    <linearGradient id="circuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5D4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="195"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Outer ring accent -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.7"/>

  <!-- Circuit pattern decorations -->
  <g clip-path="url(#circle-clip)" opacity="0.15">
    <!-- Horizontal lines -->
    <line x1="20" y1="80" x2="120" y2="80" stroke="#00F5D4" stroke-width="1.5"/>
    <circle cx="120" cy="80" r="3" fill="#00F5D4"/>
    <line x1="280" y1="100" x2="380" y2="100" stroke="#00F5D4" stroke-width="1.5"/>
    <circle cx="280" cy="100" r="3" fill="#00F5D4"/>
    <line x1="30" y1="320" x2="130" y2="320" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="130" cy="320" r="3" fill="#22D3EE"/>
    <line x1="300" y1="300" x2="380" y2="300" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="3" fill="#22D3EE"/>
    <!-- Vertical lines -->
    <line x1="80" y1="20" x2="80" y2="100" stroke="#00F5D4" stroke-width="1.5"/>
    <line x1="320" y1="280" x2="320" y2="380" stroke="#22D3EE" stroke-width="1.5"/>
    <!-- Small dots -->
    <circle cx="60" cy="150" r="2" fill="#00F5D4"/>
    <circle cx="340" cy="180" r="2" fill="#22D3EE"/>
    <circle cx="50" cy="250" r="2" fill="#7B2FBE"/>
    <circle cx="350" cy="240" r="2" fill="#7B2FBE"/>
  </g>

  <!-- Upward trend arrow (finance symbol) -->
  <g filter="url(#glow)" opacity="0.2">
    <polyline points="60,340 140,280 180,300 260,220" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="255,210 270,225 248,228" fill="#00F5D4"/>
  </g>

  <!-- Bull head - main shape -->
  <g filter="url(#shadow)">
    <!-- Bull face/head -->
    <ellipse cx="200" cy="210" rx="85" ry="95" fill="#2D2D5E"/>

    <!-- Inner face detail -->
    <ellipse cx="200" cy="215" rx="75" ry="85" fill="#3A3A70"/>

    <!-- Left horn -->
    <path d="M125,170 Q100,120 75,85 Q90,100 105,130 Q110,145 125,165" fill="url(#horn)" filter="url(#glow)"/>

    <!-- Right horn -->
    <path d="M275,170 Q300,120 325,85 Q310,100 295,130 Q290,145 275,165" fill="url(#horn)" filter="url(#glow)"/>

    <!-- Left ear -->
    <ellipse cx="128" cy="180" rx="18" ry="25" fill="#2D2D5E" transform="rotate(-20,128,180)"/>
    <ellipse cx="128" cy="180" rx="12" ry="18" fill="#3A3A70" transform="rotate(-20,128,180)"/>

    <!-- Right ear -->
    <ellipse cx="272" cy="180" rx="18" ry="25" fill="#2D2D5E" transform="rotate(20,272,180)"/>
    <ellipse cx="272" cy="180" rx="12" ry="18" fill="#3A3A70" transform="rotate(20,272,180)"/>

    <!-- Eyes - tech-style with glow -->
    <!-- Left eye -->
    <ellipse cx="168" cy="200" rx="18" ry="20" fill="#1A1A2E"/>
    <ellipse cx="168" cy="200" rx="13" ry="14" fill="#00F5D4" filter="url(#glow)"/>
    <ellipse cx="168" cy="200" rx="7" ry="8" fill="#1A1A2E"/>
    <circle cx="163" cy="195" r="3" fill="#fff" opacity="0.8"/>

    <!-- Right eye -->
    <ellipse cx="232" cy="200" rx="18" ry="20" fill="#1A1A2E"/>
    <ellipse cx="232" cy="200" rx="13" ry="14" fill="#00F5D4" filter="url(#glow)"/>
    <ellipse cx="232" cy="200" rx="7" ry="8" fill="#1A1A2E"/>
    <circle cx="227" cy="195" r="3" fill="#fff" opacity="0.8"/>

    <!-- Nose/muzzle area -->
    <ellipse cx="200" cy="255" rx="45" ry="30" fill="#252555"/>

    <!-- Nostrils -->
    <ellipse cx="183" cy="255" rx="10" ry="7" fill="#1A1A2E"/>
    <ellipse cx="217" cy="255" rx="10" ry="7" fill="#1A1A2E"/>

    <!-- Nose ring (bull symbol) -->
    <circle cx="200" cy="268" r="12" fill="none" stroke="url(#horn)" stroke-width="3" filter="url(#glow)"/>

    <!-- Mouth/smile -->
    <path d="M175,275 Q200,285 225,275" fill="none" stroke="#4A4A80" stroke-width="2" stroke-linecap="round"/>

    <!-- Circuit patterns on face -->
    <g opacity="0.4" filter="url(#glow)">
      <!-- Left side circuit -->
      <line x1="140" y1="220" x2="140" y2="240" stroke="#00F5D4" stroke-width="1.5"/>
      <circle cx="140" cy="240" r="2.5" fill="#00F5D4"/>
      <line x1="140" y1="240" x2="155" y2="240" stroke="#00F5D4" stroke-width="1.5"/>

      <!-- Right side circuit -->
      <line x1="260" y1="220" x2="260" y2="240" stroke="#00F5D4" stroke-width="1.5"/>
      <circle cx="260" cy="240" r="2.5" fill="#00F5D4"/>
      <line x1="260" y1="240" x2="245" y2="240" stroke="#00F5D4" stroke-width="1.5"/>

      <!-- Forehead circuit -->
      <line x1="185" y1="165" x2="215" y2="165" stroke="#22D3EE" stroke-width="1.5"/>
      <circle cx="200" cy="165" r="3" fill="#22D3EE"/>
      <line x1="200" y1="165" x2="200" y2="175" stroke="#22D3EE" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Brand text - separate text elements for reliable rendering -->
  <text x="118" y="358" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="32" fill="#00F5D4" filter="url(#glow)">BYTE</text>
  <text x="205" y="358" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="32" fill="#F59E0B" filter="url(#glow)">&amp;</text>
  <text x="228" y="358" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="32" fill="#FFFFFF" filter="url(#glow)">BULL</text>
</svg>