name: Daily Posts

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: America/Chicago
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python3 fetch_news.py --force --auto-educational

      - run: python3 run_today.py

      - name: Commit content + dedup log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ posts/content_log.json
          git diff --cached --quiet || git commit -m "Automated daily content ($(date +%Y-%m-%d))"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: posts-${{ github.run_id }}
          path: |
            posts/*.png
            posts/*_caption.txt
          retention-days: 90
